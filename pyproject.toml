[project]
name = "cosmic_neighborhoods"
version = "0.1.0"
description = "Personalized Rubin Sky Patches"
license = "MIT"
authors = [
    {name = "Neal McBurnett"},
]
dependencies = [
    "astropy>=6.0",
    "astropy-healpix>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "typer>=0.12",
    "rich>=13.0",
    "convertdate>=2.4",
    "pyarrow>=16.0",
    "rasterio>=1.3",
    "sqlalchemy>=2.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.2",
]

[project.scripts]
cosmic = "cosmic_neighborhoods.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true